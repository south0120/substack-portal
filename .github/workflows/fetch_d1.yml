name: Fetch RSS to D1

# ⚠️ 定期実行は停止中（2026-07-31）。
# 理由: 1,872誌を10分ごとに Worker プロキシ経由で一括取得していたが、Substack に
# レート制限され 98/1872 しか成功していなかった（429が1,643件）。1runが15〜19分かかり
# 10分cronに対してrun同士が重なるため、自分で共有IPを焼いて 429 を生んでいた。
# 記事の取り込みは Worker (fyl-api) の cron が担当している。そちらは 30誌/run の
# カーソル分割＋retry_queue で全1,871誌を約10.4時間ごとに巡回しており、取りこぼしは
# retry_queue が拾う（欠損なし・最大10.4時間の遅延のみ）。
# 復活させる場合は「全件一括」ではなく Worker と同じカーソル分割方式にすること。
on:
  # schedule:
  #   - cron: "*/10 * * * *"          # 通常: 10分ごと
  #   - cron: "*/5 22-23 * * *"       # 朝の更新ラッシュ窓(7:00-8:59 JST=22-23時UTC)は5分ごとに密に
  workflow_dispatch:

# 手動実行するときも run が重ならないようにする（重なりが429の主因だったため）
concurrency:
  group: fetch-d1
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Fetch RSS feeds to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FYL_PROXY_SECRET: ${{ secrets.FYL_PROXY_SECRET }}
        run: python scripts/fetch_to_d1.py
