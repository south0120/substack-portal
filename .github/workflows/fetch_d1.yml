name: Fetch RSS to D1

# 2026-07-31: 一度「429の原因」と判断して停止したが、計測の結果それは誤りだった。
#
# 停止して1時間測っても 429 は減らなかった（平均21/30・前半20.0→後半21.3）。
# 一方で同じ時間帯の取り込み実績は 15.8件（直近6日平均）→ 6件 に落ちた。
# このジョブは成功率こそ低い（98/1872）が、絶対量では Worker の約13倍を取り込んでいた。
#   fetch_d1 : 98成功/run × 約1.6run/時 ≒ 157成功/時
#   Worker   : 2.0成功/tick × 6tick/時  =  12成功/時
# 「無駄が多い」と「役に立っていない」は別物だった。よって復活させる。
#
# 429 の真因は流量ではなく出口IP。同一URL・同一UAで叩き比べると
#   Cloudflare(Worker/proxy)経由 → 失敗 / ローカルIP → HTTP 200
# つまり Substack が Cloudflare の egress IP を弾いている。こちらが送る量を減らしても効かない。
# 根本解決は「Cloudflare以外の経路から取りに行く」で、それは別途検討中。
# それまでは、弾かれる前提で数を投げて通った分を拾うこの構成が現実的に一番量を取れる。
on:
  schedule:
    - cron: "*/10 * * * *"          # 通常: 10分ごと
    - cron: "*/5 22-23 * * *"       # 朝の更新ラッシュ窓(7:00-8:59 JST=22-23時UTC)は5分ごとに密に
  workflow_dispatch:

# run が重ならないようにする。1run 15〜19分に対して cron が */10 なので、
# guard が無いと多重起動しうる（GitHub側のスケジュール間引きで実際は約30分毎だったが、
# 間引きに依存するのは危ういので明示的に直列化しておく）。
concurrency:
  group: fetch-d1
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Fetch RSS feeds to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FYL_PROXY_SECRET: ${{ secrets.FYL_PROXY_SECRET }}
        run: python scripts/fetch_to_d1.py
